name: macOS Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verify macOS
    runs-on: macos-latest
    env:
      # tauri-build validates the tauri Cargo features against the config
      # allowlist, but only the Tauri CLI merges tauri.macos.conf.json. Under
      # plain cargo that file is invisible, so macOSPrivateApi must be supplied
      # here to match the macos-private-api feature in Cargo.toml. Setting it
      # false fails the allowlist check before any step runs.
      TAURI_CONFIG: '{"app":{"macOSPrivateApi":true}}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify:frontend

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
