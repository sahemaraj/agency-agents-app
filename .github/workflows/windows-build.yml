# Windows build — produces Agency Agents' NSIS installers for x64 and arm64
# on a native windows-latest (x64) runner. arm64 is cross-compiled in-OS via
# the aarch64-pc-windows-msvc target (the same trick the local VM matrix uses),
# so one runner yields both installers.
#
# Signing is not yet configured. The installers are unsigned, so Windows
# SmartScreen warns on first launch
# ("More info -> Run anyway"). When a code-signing cert (EV or Azure Trusted
# Signing) is in place, signing slots in after each build step. Updater
# artifacts are disabled (auto-update deferred), so no signing key is needed.
#
# Output: the x64 + arm64 NSIS .exe installers uploaded to the workflow run.

name: Windows Build

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: Verify Windows
    runs-on: windows-latest
    env:
      # Required for every cargo invocation below: tauri-build checks the tauri
      # Cargo features against the config allowlist, and macos-private-api is
      # enabled unconditionally in Cargo.toml. Only the Tauri CLI merges
      # tauri.macos.conf.json, so plain cargo needs the value supplied here.
      # Scoped to this job so the bundling job's config stays untouched.
      TAURI_CONFIG: '{"app":{"macOSPrivateApi":true}}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      # The runner's Temurin JDK ships its own api-ms-win-core-synch-l1-2-0.dll
      # in Java_Temurin-Hotspot_jdk\...\bin, which is on PATH. That copy is
      # older than the one the Rust std sync primitives import from, so the
      # test binary loaded it and died with 0xc0000139
      # (STATUS_ENTRYPOINT_NOT_FOUND) before running a single test -- the DLL
      # resolves, but does not export what the binary asks for.
      #
      # Diagnostic evidence: of the 14 DLLs the test binary imports, 13 resolve
      # to C:\Windows\system32; only that one resolved into the JDK. Dropping
      # the JDK from PATH for this step lets it resolve from system32 like the
      # rest. This is a runner environment collision, not a product defect --
      # the app itself builds and bundles fine on Windows.
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # TEMPORARY DIAGNOSTIC — remove once the loader failure is understood.
      #
      # The lib test binary has never run on Windows: it exits 0xc0000139
      # (STATUS_ENTRYPOINT_NOT_FOUND) at load, before a single test executes,
      # so CI reports a Rust failure that says nothing about the Rust code.
      # That status means a DLL was found but did not export a symbol the
      # binary imports. This dumps the import table and resolves each
      # dependency so the offending DLL/export pair is identifiable, rather
      # than guessing. Runs on failure only, and never changes the job result.
      - name: "Diagnose Windows loader failure (temporary)"
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/debug/deps -Filter 'agency_agents_lib-*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Host 'no lib test binary found'; exit 0 }
          Write-Host "target: $($exe.FullName)"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { Write-Host 'dumpbin not found'; exit 0 }

          Write-Host '--- imported DLLs ---'
          & $dumpbin.FullName /dependents $exe.FullName | Select-String -Pattern '^\s{4}\S+\.dll' |
            ForEach-Object { $_.ToString().Trim() } | Tee-Object -Variable dlls

          Write-Host '--- resolution of each imported DLL ---'
          foreach ($d in $dlls) {
            $found = Get-Command $d -ErrorAction SilentlyContinue
            if ($found) { Write-Host "$d -> $($found.Source)" }
            else { Write-Host "$d -> NOT FOUND on PATH" }
          }

          # Decisive part: run the binary under several PATH variants and
          # report which one lets it load. Resolution above comes from
          # Get-Command (PATH order); the real loader uses its own order, so
          # only actually executing it settles which fix works. --list is used
          # so a successful load returns quickly instead of running the suite.
          $orig = $env:PATH
          $variants = [ordered]@{
            'as-is'                     = $orig
            'system32 first'            = "C:\Windows\System32;$orig"
            'no Java/Python'            = (($orig -split ';' | Where-Object { $_ -notmatch 'Java_|jdk|Python' }) -join ';')
            'no hostedtoolcache at all' = (($orig -split ';' | Where-Object { $_ -notmatch 'hostedtoolcache' }) -join ';')
          }
          foreach ($name in $variants.Keys) {
            $env:PATH = $variants[$name]
            & $exe.FullName --list *> $null
            $code = $LASTEXITCODE
            $hex = '0x{0:x8}' -f ($code -band 0xffffffff)
            if ($code -eq 0) { Write-Host "PATH[$name] -> LOADS OK" }
            else { Write-Host "PATH[$name] -> exit $code ($hex)" }
          }
          $env:PATH = $orig

      - name: Self-check stateless lockfile verification
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin agency-agents-app
          & src-tauri/target/debug/agency-agents-app.exe verify `
            --project src-tauri/tests/fixtures/verify-project `
            --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    name: Build Windows installers (x64 + arm64, unsigned)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (+ arm64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # x64 (native). Updater artifacts belong to the macOS release. shell: bash so the
      # --config JSON survives quoting (Windows runners ship Git Bash).
      - name: Build x64 installer
        shell: bash
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # arm64 (cross-compiled in-OS). The frontend is already built; this just
      # recompiles the Rust binary for arm64 and bundles its NSIS installer.
      - name: Build arm64 installer
        shell: bash
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: agency-agents-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload arm64 installer
        uses: actions/upload-artifact@v4
        with:
          name: agency-agents-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
